dataset: # Required.
  type: base
  train:
    meta_file_list:
      - /mnt/lustre/share/fe/codec_list/trainset.txt
  test:
    meta_file_list:
      - /mnt/lustre/share/fe/codec_list/kodak.txt
  color_image: True
  batch_size: 16
  workers: 3            # number of workers of dataloader for each process
  data_augment:
    train:
      - img_random_crop:
          crop_size: 256
    test:

log_dir: $EXP_ROOT/logs
GPUs: 1  # deprecated
test_n_jobs: 0

lr: 1e-4
lr_milestion: [3000] # training with 1e-4 forever
lr_scheduler_gamma: 0.5

epoch: 2001
show_interval: 200
show_bpp_interval: 20000
test_interval: 2 # deprecated
snapshot_interval: 2000

linklink: True
load_epoch: -1

codec: gg18

y_encode: YGG18
y_encode_args:
  normalization: gdn
  conv: signal  # 'signal' or 'conv'

y_decode: YGG18
y_decode_args:
  deconv: signal_upsample  # 'signal' or 'deconv' or 'signal_upsample' or 'conv_upsample'
  upsample_mode: bilinear # bilinear' or 'nearest' or 'subpixel'
  conv_first: True # True or False, for subpixel must be True

entropy_model: gaussian
entropy_model_args:
  likelihood_bound: 0.000000001
  scale_bound: 0.11

y_quant: RT

z_encode: ZGG18
z_encode_args:
  normalization: gdn
  conv: signal

z_decode: ZGG18
z_decode_args:
  deconv: conv_upsample # according to original code, disable rdft here
  upsample_mode: bilinear
  conv_first: True

z_quant: RT
z_entropy_model: bottleneck
z_entropy_model_args:
  likelihood_bound: 0.000000001

post: NONE # to use post process, pls set "post: grdn"
yuv_pre: NONE # to use yuv_pre process, pls set "yuv_per: bgr/rgb/yuv/yuv420"

BIT: 1
b_range: [0]
num_features_encode: 256
num_features_decode: 256
num_features_entropy_model: 256

entropy_AE: True
compress_per_channel: True
decompress: False
ae_backend: cc
adapt: False
lambda1: 0.
lambda2: 0.01
lambda4: 1.
lambda4s: [1.]



