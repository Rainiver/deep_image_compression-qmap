dataset: # Required.
  type: dct
  train:
    meta_file_list:
      - /mnt/lustre/share/fe/codec_list/trainset.txt
    flatten: True
  test:
    meta_file_list:
      - /mnt/lustre/share/fe/codec_list/kodak.txt  # if not set, random jpeg quality will be sampled in range [10, 100]
    flatten: True
  color_image: True
  batch_size: 32
  workers: 3            # number of workers of dataloader for each process
  data_augment:
    train:
      - img_random_crop:
          crop_size: 256
    test:
      - img_random_crop:
          crop_size: 256
log_dir: $EXP_ROOT/logs
test_n_jobs: 0

lr: 1e-4
lr_milestion: [ 150 ]
lr_scheduler_gamma: 0.1

epoch: 2000
show_interval: 75
show_bpp_interval: 2500
test_interval: 2 # deprecated
snapshot_interval: 50

linklink: True
load_epoch: -1

codec: dct-idf
vars:
model_arch:
  flow:
    import: nets.flow.flows
    kwargs:
      tag: IDF
      descale: False
      n_levels: 4
      n_flows: 8
      n_channels: 512
      in_channels: 6
      densenet_depth: 12
      splitfactor: 4
      inverse_bin_width: 256
      splitprior_type: densenet #choices['none', 'resnet', 'densenet', 'densenet++']
      coupling_type: densenet #choices['resnet', 'densenet', 'densenet++']
      round_approx: smooth #choice ['smooth', 'stochastic']
      context: none #choices['none', 'GG18C']
      entropy_param: none #choices['none', 'GG18C']
      inv_permute: False
      rezero: False

  entropy_pre:
    import: nets.entropy.entropy_models
    kwargs:
      tag: logistic
      delta: 0.00390625 # 1 / 256
      scale_bound: 0.00000001 #1e-8

  prior:
    import: nets.layers.Prior
    kwargs:
      channel: 192
      height: 8
      width: 8
      n_mixtures: 5

  pre:
    import: nets.pre.pre_builder.pre
    kwargs:
      tag: dct-coef
      flatten: False
      normalize: False

train_gt: tmp/x_after_pre
test_gt: tmp/x_after_pre
fast_train: True
pre: dct-coef

blocks: False # fen kuai?

BIT: 1
b_range: [ 0 ]
num_features_encode: 256
num_features_decode: 256
num_features_entropy_model: 192

entropy_AE: True
compress_per_channel: True
decompress: False
ae_backend: cc
adapt: False
lambda1: 0.
lambda2: 0.
lambda4: 1.
lambda4s: [ 1. ]



