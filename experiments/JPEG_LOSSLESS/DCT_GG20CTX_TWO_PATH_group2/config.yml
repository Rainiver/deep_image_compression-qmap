dataset: # Required.
  type: dct
  train:
    meta_file_list:
      - /mnt/lustre/share/codec_list/trainset.txt
  test:
    meta_file_list:
      - /mnt/lustre/share/codec_list/kodak.txt  # if not set, random jpeg quality will be sampled in range [10, 100]
  color_image: True
  inverse_zigzag: True
  batch_size: 16
  workers: 3            # number of workers of dataloader for each process
  data_augment:
    train:
      - img_random_crop:
          crop_size: 256
    test:
log_dir: $EXP_ROOT/logs
test_n_jobs: 0

lr: 1e-4
lr_milestion: [1500]
lr_scheduler_gamma: 0.1

epoch: 2001
show_interval: 200
show_bpp_interval: 0
test_interval: 2 # deprecated
snapshot_interval: 50

linklink: True
load_epoch: -1

codec: gg20c-iter-cc-two-path
vars:
model_arch:
  y_encoder:
    import: torch.nn.Identity

  y_quant:
    import: quant.quantizator.quantizators
    kwargs:
      tag: round

  # DCT coef didn't need round
  y_quant_round:
    import: quant.quantizator.quantizators
    kwargs:
      tag: round

  y_decoder:
    import: torch.nn.Identity

  z_encoder:
    import: nets.encoder.encoders
    kwargs:
      tag: ZGG18C
      in_channels: 64
      out_channels: 192

  z_quant:
    import: quant.quantizator.quantizators
    kwargs:
      tag: RT
  # TODO: delete redundant codec
  z_quant_round:
    import: quant.quantizator.quantizators
    kwargs:
      tag: RT

  z_decoder:
    import: nets.decoder.decoders
    kwargs:
      tag: ZGG18C
      out_channels: 192
      in_channels: 64  # actually 128

  y_parameter:
    import: nets.param.ParamGG20CIteratorCC_two_path
    kwargs:
      y_channels: 64
      hyper_channels: 128
      out_channels: 128
      n_groups: 2
      lrp: identity

  gate:
    import: nets.context.gate_models
    kwargs:
      tag: checkerboard-slice-assign

  entropy_pre:
    import: nets.entropy.entropy_models
    kwargs:
      tag: laplacian
      likelihood_bound: 0.000000001
      delta: 1
      scale_bound: 0.11

  z_entropy_pre:
    import: nets.entropy.entropy_models
    kwargs:
      tag: bottleneck
      delta: 1
      num_filters: 192
      likelihood_bound: 0.000000001

  pre:
    import: nets.pre.pre_builder.pre
    kwargs:
      tag: dct-coef
      flatten: false
      normalize: false
      scale_factor: 255

  post:
    import: torch.nn.Identity

train_gt: tmp/x_after_pre
test_gt: tmp/x_after_pre
fast_train: True
pre: dct-coef

blocks: False # fen kuai?

BIT: 1
b_range: [0]
num_features_encode: 256
num_features_decode: 256
num_features_entropy_model: 192

entropy_AE: True
compress_per_channel: True
decompress: False
ae_backend: cc
adapt: False
lambda1: 0.
lambda2: 1.
lambda4: 1.
lambda4s: [1.]



