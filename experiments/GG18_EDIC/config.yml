dataset: # Required.
  type: base
  train:
    meta_file_list:
      - /mnt/lustre/share/fe/codec_list/trainset.txt
  test:
    meta_file_list:
      - /mnt/lustre/share/fe/codec_list/kodak.txt
  color_image: True
  batch_size: 16
  workers: 3            # number of workers of dataloader for each process
  data_augment:
    train:
      - img_random_crop:
          crop_size: 256
    test:

log_dir: $EXP_ROOT/logs
GPUs: 1  # deprecated
test_n_jobs: 0

lr: 1e-4
lr_milestion: [3000] # training with 1e-4 forever
lr_scheduler_gamma: 0.5

epoch: 2001
show_interval: 200
show_bpp_interval: 20000
test_interval: 2 # deprecated
snapshot_interval: 2000

linklink: True
load_epoch: -1

codec: edic

y_encode: YGG18
y_encode_args:
  normalization: gdn
  conv: signal  # 'signal' or 'conv'

y_decode: YGG18
y_decode_args:
  deconv: signal  # 'signal' or 'deconv'

y_parameter: EDIC
y_parameter_args:
  in_c: 512
  out_c: 1536

entropy_model: gaussian
entropy_model_args:
  K: 2
  likelihood_bound: 0.000000001
  scale_bound: 0.11

y_quant: RT

z_encode: ZGG18C
z_encode_args:
  normalization: gdn
  conv: signal

z_attention: senet

z_decode: ZGG18C
z_decode_args:
  deconv: deconv # according to original code, disable rdft here

z_quant: RT
z_entropy_model: bottleneck
z_entropy_model_args:
  likelihood_bound: 0.000000001

post: edic # to use post process, pls set "post: grdn"
yuv_pre: NONE # to use yuv_pre process, pls set "yuv_per: deconv, 2deconv, bilinear"
blocks: False # fen kuai?

BIT: 1
b_range: [0]
num_features_encode: 256
num_features_decode: 256
num_features_entropy_model: 256

entropy_AE: True
compress_per_channel: True
decompress: False
ae_backend: cc
adapt: False
lambda1: 0.
lambda2: 0.01
lambda4: 1.
lambda4s: [1.]



