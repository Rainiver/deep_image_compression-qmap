api_version: 1.0 # SCI(spring common interface) 版本号
metadata:
  node_name: codec_trainv2 # name of the node
spec:
  entrypoint: main

  templates:
    # template main
    - name: main
      stages:
        - name: eval
          template: eval-task
          arguments:
            - name: new_arch
              value: ~
            - name: task_config
              path: gg18.yaml
            - name: weights
              value: results/outputs/model/ckpt.pth.tar

    # template search-task
    - name: eval-task
      type: CodecEvalStage
      inputs:
        - name: new_arch # for NAS or pruned model
        - name: task_config
        - name: weights
      outputs:
        - type: Model

